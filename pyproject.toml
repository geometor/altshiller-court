[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "geometor-altshiller-court"
authors = [{name = "phi ARCHITECT", email = "phi@geometor.com"}]
description = "Digital scholarly edition and constructive analysis of Nathan Altshiller-Court's College Geometry (1952)."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "Pillow",
    "PyYAML",
    "sympy",
    "geometor-model",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
altshiller-court = "geometor.altshiller_court.__main__:main"
geometor-altshiller-court = "geometor.altshiller_court.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "geometor.altshiller_court.__version__"}

[project.urls]
"Website" = "https://geometor.github.io/altshiller-court"
"Repository" = "https://github.com/geometor/altshiller-court"
"Issues" = "https://github.com/geometor/altshiller-court/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
