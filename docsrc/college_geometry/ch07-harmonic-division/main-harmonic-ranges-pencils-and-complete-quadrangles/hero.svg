<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" class="euclid-graphic" data-graphic-id="hero-harmonic_quadrangle.harmonic_quadrangle" data-folio="hero-harmonic_quadrangle" data-graphic="harmonic_quadrangle">
  <style>
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
