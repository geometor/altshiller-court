      stroke: #18181b;
      stroke-width: 1.5;
      stroke-dasharray: 4, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc-dotted {
      stroke: #18181b;
      stroke-width: 1.5;
      stroke-dasharray: 2.5, 2.5;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-ray {
      stroke: #18181b;
      stroke-width: 1.25;
      stroke-linecap: round;
      fill: none;
      opacity: 0.85;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-tick {
      stroke: #18181b;
      stroke-width: 1.5;
      stroke-linecap: round;
      fill: none;
    }
    .geom-tick-mark {
      stroke: #16a34a;
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-ang-arc {
