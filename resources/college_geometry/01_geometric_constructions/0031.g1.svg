    .geom-point {
      fill: #18181b;
      stroke: #ffffff;
      stroke-width: 1;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-dot {
      fill: #18181b;
      stroke: none;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-label {
